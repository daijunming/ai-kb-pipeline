[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kb-pipeline"
version = "0.1.0"
description = "AI-native knowledge extraction pipeline with structured intermediate representations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.scripts]
kb = "kb_pipeline.cli:main"
